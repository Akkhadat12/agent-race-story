<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9e8df">
  <meta name="description" content="An interactive visual story about AI agents, cyber attackers, defenders, and human decisions.">
  <title>The Agent Race</title>
  <link rel="preload" as="image" href="assets/cover.svg">
  <link rel="stylesheet" href="styles.css?v=svg-2">
  <script defer src="story.js"></script>
</head>
<body>
  <main id="story" aria-label="The Agent Race visual story">
    <section class="scene active cover" data-scene="0" aria-label="Cover: The Agent Race" aria-hidden="false">
      <div class="frame">
        <img class="art" src="assets/cover.svg" width="1600" height="900" alt="" fetchpriority="high">
        <h1 class="title cover-title">THE<br><span>AGENT RACE</span></h1>
        <button class="hotspot cover-hotspot" type="button" data-advance aria-label="Enter the story by selecting the authorization console" style="--x:50%;--y:82%;--w:24%;--h:19%;--accent:#ecb678">
          <span class="target-ring" aria-hidden="true"></span><span class="target-label" aria-hidden="true">ENTER</span>
        </button>
      </div>
    </section>

    <section class="scene" data-scene="1" aria-label="Human pace" aria-hidden="true">
      <div class="frame">
        <img class="art" src="assets/manual.svg" width="1600" height="900" alt="">
        <h2 class="title">HUMAN<br>PACE</h2>
        <button class="hotspot" type="button" data-advance aria-label="Open the case folder and continue" style="--x:28%;--y:60%;--w:18%;--h:26%;--accent:#e5a462">
          <span class="target-ring" aria-hidden="true"></span><span class="target-label" aria-hidden="true">OPEN</span>
        </button>
      </div>
    </section>

    <section class="scene" data-scene="2" aria-label="Attack, in parallel" aria-hidden="true">
      <div class="frame">
        <img class="art" src="assets/attack.svg" width="1600" height="900" alt="">
        <h2 class="title">ATTACK, IN<br>PARALLEL</h2>
        <button class="hotspot" type="button" data-advance aria-label="Trace the copper task junction and continue" style="--x:63%;--y:46%;--w:18%;--h:24%;--accent:#d8894e">
          <span class="target-ring" aria-hidden="true"></span><span class="target-label" aria-hidden="true">TRACE</span>
        </button>
      </div>
    </section>

    <section class="scene" data-scene="3" aria-label="Defense, in parallel" aria-hidden="true">
      <div class="frame">
        <img class="art" src="assets/defend.svg" width="1600" height="900" alt="">
        <h2 class="title">DEFENSE, IN<br>PARALLEL</h2>
        <button class="hotspot" type="button" data-advance aria-label="Inspect the reviewed patch and continue" style="--x:81%;--y:74%;--w:24%;--h:25%;--accent:#64bab4">
          <span class="target-ring" aria-hidden="true"></span><span class="target-label" aria-hidden="true">REVIEW</span>
        </button>
      </div>
    </section>

    <section class="scene" data-scene="4" aria-label="The inside risk" aria-hidden="true">
      <div class="frame">
        <img class="art" src="assets/risk.svg" width="1600" height="900" alt="">
        <h2 class="title">THE INSIDE<br>RISK</h2>
        <button class="hotspot" type="button" data-advance aria-label="Inspect the untrusted incoming document and continue" style="--x:52%;--y:64%;--w:24%;--h:27%;--accent:#dd965e">
          <span class="target-ring" aria-hidden="true"></span><span class="target-label" aria-hidden="true">INSPECT</span>
        </button>
      </div>
    </section>

    <section class="scene" data-scene="5" aria-label="The human edge" aria-hidden="true">
      <div class="frame">
        <img class="art" src="assets/human.svg" width="1600" height="900" alt="">
        <h2 class="title">THE HUMAN<br>EDGE</h2>
        <div class="controls-caption" aria-hidden="true"><span>SET LIMITS</span><span>VERIFY</span><span>INTERRUPT</span></div>
        <button class="hotspot" type="button" data-advance aria-label="Review the evidence and continue to the final scene" style="--x:51%;--y:68%;--w:24%;--h:28%;--accent:#e6ae71">
          <span class="target-ring" aria-hidden="true"></span><span class="target-label" aria-hidden="true">DECIDE</span>
        </button>
      </div>
    </section>

    <section class="scene final" data-scene="6" aria-label="The race continues" aria-hidden="true">
      <div class="frame">
        <img class="art" src="assets/final.svg" width="1600" height="900" alt="">
        <h2 class="title">THE RACE<br>CONTINUES</h2>
      </div>
    </section>
    <p id="scene-announcement" class="sr-only" aria-live="polite">Cover: The Agent Race</p>
  </main>
</body>
</html>
